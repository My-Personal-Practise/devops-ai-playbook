apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/My-Personal-Practise/devops-ai-playbook.git'
    targetRevision: feature/devops-ai
    path: gitops
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: boutique
  syncPolicy: {}
    syncPolicy:
     automated:
       prune: true
       selfHeal: true
